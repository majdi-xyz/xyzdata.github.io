<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0066FF"/>

  <!-- Data flow icon in white -->
  <g transform="translate(25, 35)">
    <!-- Three input nodes -->
    <circle cx="5" cy="5" r="3" fill="white" opacity="0.7"/>
    <circle cx="5" cy="15" r="3" fill="white"/>
    <circle cx="5" cy="25" r="3" fill="white" opacity="0.7"/>

    <!-- Connecting lines -->
    <path d="M8 5 Q20 5 25 15" stroke="white" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M8 15 L25 15" stroke="white" stroke-width="3" fill="none"/>
    <path d="M8 25 Q20 25 25 15" stroke="white" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Output node -->
    <circle cx="30" cy="15" r="4" fill="white"/>
    <circle cx="30" cy="15" r="2" fill="#0066FF"/>

    <!-- Arrow pointing right -->
    <path d="M35 15 L45 15 M41 11 L45 15 L41 19" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
